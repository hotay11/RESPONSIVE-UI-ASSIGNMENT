<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PESA tests</title>
</head>
<body>
<h1>PESA tests</h1>
<p id="summary"></p>
<ul id="results"></ul>

<script src="scripts/main.js"></script>
<script>
const V = Validators, S = Search;
let passed = 0, total = 0;

function test(name, condition) {
  total++;
  if (condition) passed++;
  const li = document.createElement("li");
  li.textContent = (condition ? "PASS: " : "FAIL: ") + name;
  li.style.color = condition ? "green" : "red";
  document.getElementById("results").append(li);
}

// Description
test("good description passes", V.validateDescription("Lunch at cafeteria") === "");
test("leading space fails", V.validateDescription(" Lunch") !== "");
test("trailing space fails", V.validateDescription("Lunch ") !== "");
test("empty fails", V.validateDescription("") !== "");
test("double space fails", V.validateDescription("Lunch  now") !== "");
test("single letter passes", V.validateDescription("X") === "");
// Advanced regex (back-reference)
test("repeated word 'the the' fails", V.validateDescription("the the bus") !== "");
test("repeated word is case-insensitive", V.validateDescription("The the bus") !== "");
test("different words pass", V.validateDescription("the red bus") === "");
// Amount
test("amount 12.50 passes", V.validateAmount("12.50") === "");
test("amount 0 passes", V.validateAmount("0") === "");
test("amount 012 fails", V.validateAmount("012") !== "");
test("amount 1.234 fails", V.validateAmount("1.234") !== "");
test("amount -5 fails", V.validateAmount("-5") !== "");
test("amount abc fails", V.validateAmount("abc") !== "");
// Date
test("date 2026-10-13 passes", V.validateDate("2026-10-13") === "");
test("leap day 2024-02-29 passes", V.validateDate("2024-02-29") === "");
test("2026-02-29 fails (not a leap year)", V.validateDate("2026-02-29") !== "");
test("2026-02-31 fails", V.validateDate("2026-02-31") !== "");
test("2026-13-01 fails", V.validateDate("2026-13-01") !== "");
test("13/10/2026 fails", V.validateDate("13/10/2026") !== "");
// Category
test("'Food-Court' passes", V.validateCategory("Food-Court") === "");
test("'Fast Food' passes", V.validateCategory("Fast Food") === "");
test("'Food123' fails", V.validateCategory("Food123") !== "");
test("'-Food' fails", V.validateCategory("-Food") !== "");
// Rates
test("rate 0.0004 passes", V.validateRate("0.0004") === "");
test("rate 0 fails", V.validateRate("0") !== "");
// Search
test("bad regex returns an error", S.compileRegex("(abc").error !== "");
test("empty search returns null", S.compileRegex("").re === null);
test("highlight wraps match", S.highlight("Coffee", /cof/i) === "<mark>Cof</mark>fee");
test("highlight escapes HTML", S.highlight("<b>", null) === "&lt;b&gt;");
test("highlight escapes inside marks", S.highlight("a<b", /<b/) === "a<mark>&lt;b</mark>");
// Import
const good = { id: "rec_1", description: "Lunch", amount: 5, category: "Food", date: "2026-10-13", createdAt: "x", updatedAt: "x" };
test("valid import passes", V.validateImport([good]) === "");
test("non-list import fails", V.validateImport({}) !== "");
test("duplicate ids fail", V.validateImport([good, good]) !== "");
test("missing timestamps fail", V.validateImport([Object.assign({}, good, { createdAt: undefined })]) !== "");
test("amount as text fails", V.validateImport([Object.assign({}, good, { amount: "5" })]) !== "");

document.getElementById("summary").textContent = passed + " / " + total + " tests passed";
</script>
</body>
</html>
